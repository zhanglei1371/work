            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f6e9d7 0%, #e3d5c0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 20px 16px 28px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            border: 2px solid #fff;
            text-align: center;
        }
        h1 { font-size: 22px; color: #4a3728; letter-spacing: 1px; margin-bottom: 2px; }
        .sub { font-size: 13px; color: #7f6a58; border-bottom: 2px dashed #dac9b5; padding-bottom: 10px; margin-bottom: 14px; }

        /* 单元按钮 - 自动换行 */
        .unit-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }
        .unit-btn {
            background: #f0e5d8;
            border: 2px solid #dac9b5;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 600;
            color: #4a3728;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            flex: 0 1 auto;
        }
        .unit-btn.active {
            background: #4a3728;
            border-color: #4a3728;
            color: white;
            box-shadow: 0 3px 0 #2b1f14;
        }
        .unit-btn:active { transform: translateY(2px); }

        .score-area {
            display: flex;
            justify-content: space-between;
            background: #4a3728;
            padding: 7px 16px;
            border-radius: 60px;
            color: #f3e3d2;
            font-weight: bold;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 20px 10px;
            border-radius: 36px;
            margin-bottom: 18px;
            box-shadow: inset 0 -6px 0 #c6b3a0;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .word-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fcf6ef;
            padding: 6px 20px 6px 28px;
            border-radius: 60px;
        }
        .english-word {
            font-size: 36px;
            font-weight: 700;
            color: #2d1f14;
            letter-spacing: 1px;
        }
        .speak-btn {
            background: #ffb74d;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 24px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #f57c00;
            transition: 0.1s ease;
            color: #4a2e1a;
            flex-shrink: 0;
        }
        .speak-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #f57c00;
        }
        .hint {
            margin-top: 8px;
            font-size: 15px;
            color: #a08772;
            background: #efe3d8;
            padding: 3px 20px;
            border-radius: 30px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .option-btn {
            background: white;
            border: 3px solid #dac9b5;
            padding: 12px 4px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            color: #3a2a1e;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #b8a18b;
            text-align: center;
            position: relative;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #b8a18b;
        }
        .option-btn.correct {
            background: #8bc34a;
            border-color: #558b2f;
            color: white;
            box-shadow: 0 4px 0 #33691e;
        }
        .option-btn.wrong {
            background: #ef5350;
            border-color: #b71c1c;
            color: white;
            box-shadow: 0 4px 0 #7f0000;
        }
        .option-btn .speak-small {
            font-size: 16px;
            margin-left: 6px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .feedback {
            font-size: 22px;
            min-height: 36px;
            line-height: 36px;
            margin-bottom: 8px;
        }

        .next-btn {
            background: #ffb74d;
            border: none;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: bold;
            color: #4a2e1a;
            border-bottom: 6px solid #f57c00;
            cursor: pointer;
            width: 100%;
        }
        .next-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }
        .restart {
            margin-top: 12px;
            background: none;
            border: 1px solid #b8a18b;
            padding: 6px 16px;
            border-radius: 30px;
            color: #5e4b3b;
            cursor: pointer;
            font-size: 14px;
        }
        .no-words { color: #b71c1c; padding: 20px; font-weight: bold; }
    </style>
</head>

    function getDistractors(correctZh, unit, count = 3) {
        const allWords = unitWords[unit] || [];
        const allZh = allWords.map(item => item.zh);
        const candidates = allZh.filter(item => item !== correctZh);
        const shuffled = shuffleArray([...candidates]);
        return shuffled.slice(0, count);
    }

    // 语音朗读
    function speakText(text) {
        if (!window.speechSynthesis) {
            alert('您的浏览器不支持语音合成，请使用 Chrome、Edge 或 Safari');
            return;
        }
        // 取消任何正在进行的语音
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1;
        window.speechSynthesis.speak(utterance);
    }

    // ======================== 核心逻辑 ========================
    function loadUnit(unit) {
        currentUnit = unit;
        // 激活按钮样式
        unitBtns.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.unit === unit);
        });

        const words = unitWords[unit];
        if (!words || words.length === 0) {
            wordDisplay.innerText = '⚠️ 无词汇';
            hintDisplay.innerText = '请添加词汇或切换单元';
            optionsContainer.innerHTML = '';
            feedbackDisplay.innerHTML = '';
            nextBtn.style.display = 'none';
            counterDisplay.innerText = '0/0';
            speakBtn.style.display = 'none';
            return;
        }
        speakBtn.style.display = 'inline-flex';

        // 重置得分和题目
        score = 0;
        scoreDisplay.innerText = '0';
        currentQuestions = shuffleArray([...words]);
        currentIndex = 0;
        answered = false;
        nextBtn.style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            wordDisplay.innerText = '🎉 完成啦！';
            hintDisplay.innerText = '太棒了！点击"重新挑战"再来一次';
            optionsContainer.innerHTML = '';
            feedbackDisplay.innerHTML = '🏆 全部答对！继续加油！';
            nextBtn.style.display = 'none';
            counterDisplay.innerText = `${currentQuestions.length}/${currentQuestions.length}`;
            speakBtn.style.display = 'none';
            return;
        }

        const q = currentQuestions[currentIndex];
        currentWord = q;
        wordDisplay.innerText = q.en;
        hintDisplay.innerText = '请选择正确的中文意思 👇';
        feedbackDisplay.innerHTML = '🤔 选一个答案吧';
        counterDisplay.innerText = `${currentIndex + 1}/${currentQuestions.length}`;
        answered = false;
        speakBtn.style.display = 'inline-flex';

        // 生成选项
        const correct = q.zh;
        const distractors = getDistractors(correct, currentUnit, 3);
        let options = [correct, ...distractors];
        options = shuffleArray(options);

        optionsContainer.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.dataset.zh = opt;
            btn.onclick = function() { selectOption(opt); };
            optionsContainer.appendChild(btn);
        });
        nextBtn.style.display = 'none';
    }

    function selectOption(selectedZh) {
        if (answered || !currentWord) return;

        const buttons = document.querySelectorAll('.option-btn');
        let correctBtn = null;
        let selectedBtn = null;

        buttons.forEach(btn => {
            const zh = btn.dataset.zh;
            if (zh === currentWord.zh) correctBtn = btn;
            if (zh === selectedZh) selectedBtn = btn;
        });

        if (!correctBtn || !selectedBtn) return;

        if (selectedZh === currentWord.zh) {
            selectedBtn.classList.add('correct');
            feedbackDisplay.innerHTML = '✅ 完全正确！太棒啦！ 🎉';
            score += 10;
            scoreDisplay.innerText = score;
        } else {
            selectedBtn.classList.add('wrong');
            correctBtn.classList.add('correct');
            feedbackDisplay.innerHTML = `❌ 再想想哦，正确答案是 “${currentWord.zh}”`;
        }

        buttons.forEach(btn => btn.style.pointerEvents = 'none');
        answered = true;
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        if (currentIndex < currentQuestions.length) {
            currentIndex++;
            loadQuestion();
        }
    }

    function restartGame() {
        loadUnit(currentUnit);
    }

    // ======================== 事件绑定 ========================
    // 单元按钮
    unitBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const unit = this.dataset.unit;
            loadUnit(unit);
        });
    });

    // 语音按钮
    speakBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const word = wordDisplay.innerText;
        if (word && !word.includes('🎉') && !word.includes('⚠️')) {
            speakText(word);
        }
    });

    // 默认加载 Welcome
    window.onload = function() {
        loadUnit('Welcome');
    };
</script>
</body>
</html>
