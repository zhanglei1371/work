<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>球磨机转速演示 - 药剂学</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "SimSun", sans-serif;
    background: #006699;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 24px;
    color: #fff;
    margin-bottom: 16px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  .btn-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-bar button {
    padding: 10px 28px;
    border: 2px solid #fff;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.2s;
    min-width: 100px;
  }
  .btn-bar button:hover {
    background: rgba(255,255,255,0.3);
  }
  .btn-bar button.active {
    background: #fff;
    color: #006699;
  }
  .stage {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mill-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .mill-unit canvas {
    background: #006699;
    border-radius: 8px;
  }
  .mill-label {
    margin-top: 8px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }
  .mill-label.slow { color: #ff9999; }
  .mill-label.normal { color: #99ff99; }
  .mill-label.fast { color: #ffdd44; }
  .info-panel {
    margin-top: 20px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 16px 24px;
    max-width: 800px;
    color: #e0e0e0;
    font-size: 13px;
    line-height: 1.8;
  }
  .info-panel h3 { color: #fff; margin-bottom: 8px; }
  .info-panel code {
    background: rgba(255,255,255,0.15);
    padding: 2px 8px;
    border-radius: 4px;
    color: #ffdd44;
  }
  footer { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.4); }
</style>
</head>
<body>

<h1>球磨机转速演示</h1>

<div class="btn-bar">
  <button id="btn-slow" onclick="setMode('slow')">过慢</button>
  <button id="btn-normal" onclick="setMode('normal')">适当</button>
  <button id="btn-fast" onclick="setMode('fast')">过快</button>
  <button id="btn-compare" onclick="setMode('compare')">对比</button>
</div>

<div class="stage" id="stage">
  <!-- Canvas(s) will be created dynamically -->
</div>

<div class="info-panel">
  <h3>临界转速公式</h3>
  <code>nc = 42.3 / √D</code> （rpm，D为筒体直径，单位米）<br>
  实际工作转速取临界转速的 60%-85%，球在接近最高点处抛落砸下，粉碎效率最高。
  <br>过慢：球滑落，无冲击力。过快：球紧贴筒壁，完全离心不研磨。
</div>

<footer>药剂学教学演示 · 球磨机粉碎原理</footer>

<script>
// ===== 球磨机动画引擎 =====

class BallMill {
  constructor(canvas, mode) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.w = canvas.width;
    this.h = canvas.height;
    this.cx = this.w / 2;
    this.cy = this.h / 2;
    this.r = Math.min(this.w, this.h) / 2 - 20;
    this.mode = mode;  // 'slow' | 'normal' | 'fast'
    this.angle = 0;
    this.balls = [];
    this.initBalls();
  }

  initBalls() {
    const count = 12;
    const ballR = 7;
    const colors = [
      '#ff6666', '#ffaa44', '#44ff44', '#4488ff',
      '#aa44ff', '#ff44aa', '#44dddd', '#ff8844',
      '#88ff44', '#4488ff', '#ff44ff', '#ffff44'
    ];
    // 初始：球堆积在底部
    for (let i = 0; i < count; i++) {
      const angle = Math.PI / 2 + (Math.random() - 0.5) * 1.5;
      const dist = this.r * (0.1 + Math.random() * 0.6);
      this.balls.push({
        x: this.cx + Math.cos(angle) * dist,
        y: this.cy + Math.sin(angle) * dist,
        vx: 0, vy: 0,
        radius: ballR,
        onWall: false,
        wallAngle: 0,
        color: colors[i % colors.length],
      });
    }
  }

  update() {
    const omega = this.getOmega();
    const gravity = 0.4;
    const damping = 0.96;

    for (let ball of this.balls) {
      const dx = ball.x - this.cx;
      const dy = ball.y - this.cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (ball.onWall) {
        // 附壁阶段：随筒壁旋转
        ball.wallAngle += omega;
        ball.x = this.cx + Math.cos(ball.wallAngle) * (this.r - ball.radius);
        ball.y = this.cy + Math.sin(ball.wallAngle) * (this.r - ball.radius);

        // 判断脱落条件
        const a = ((ball.wallAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

        if (this.mode === 'slow') {
          // 过慢：在较低位置滑落（角度 0.3π~0.75π，即右下到左下）
          if (a > Math.PI * 0.3 && a < Math.PI * 0.75) {
            ball.onWall = false;
            // 沿壁面切向滑落，速度很小
            ball.vx = -Math.sin(ball.wallAngle) * omega * this.r * 0.3;
            ball.vy = Math.cos(ball.wallAngle) * omega * this.r * 0.3;
          }
        } else if (this.mode === 'normal') {
          // 适当：在接近最高点处抛落（角度 1.3π~1.9π，即左上到右上上方）
          if (a > Math.PI * 1.3 && a < Math.PI * 1.9) {
            ball.onWall = false;
            // 保留切向速度 + 重力 → 抛物线砸下
            ball.vx = -Math.sin(ball.wallAngle) * omega * this.r;
            ball.vy = Math.cos(ball.wallAngle) * omega * this.r;
          }
        }
        // fast 模式：永不脱落
      } else {
        // 自由飞行：重力 + 速度
        ball.vy += gravity;
        ball.vx *= damping;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // 碰壁检测
        const ndx = ball.x - this.cx;
        const ndy = ball.y - this.cy;
        const ndist = Math.sqrt(ndx * ndx + ndy * ndy);
        if (ndist >= this.r - ball.radius) {
          // 碰到壁面，吸附
          ball.x = this.cx + (ndx / ndist) * (this.r - ball.radius);
          ball.y = this.cy + (ndy / ndist) * (this.r - ball.radius);
          ball.onWall = true;
          ball.wallAngle = Math.atan2(ndy, ndx);
          ball.vx = 0;
          ball.vy = 0;
        }

        // 球与球之间碰撞（简化处理）
      }
    }

    // 球间碰撞
    for (let i = 0; i < this.balls.length; i++) {
      for (let j = i + 1; j < this.balls.length; j++) {
        const b1 = this.balls[i];
        const b2 = this.balls[j];
        const ddx = b2.x - b1.x;
        const ddy = b2.y - b1.y;
        const dd = Math.sqrt(ddx * ddx + ddy * ddy);
        const minDist = b1.radius + b2.radius;
        if (dd < minDist && dd > 0.1) {
          const overlap = (minDist - dd) / 2;
          const nx = ddx / dd;
          const ny = ddy / dd;
          b1.x -= nx * overlap;
          b1.y -= ny * overlap;
          b2.x += nx * overlap;
          b2.y += ny * overlap;
          // 简单弹性碰撞
          if (!b1.onWall && !b2.onWall) {
            const tmpvx = b1.vx, tmpvy = b1.vy;
            b1.vx = b2.vx * 0.5;
            b1.vy = b2.vy * 0.5;
            b2.vx = tmpvx * 0.5;
            b2.vy = tmpvy * 0.5;
          }
        }
      }
    }

    this.angle += omega;
  }

  getOmega() {
    if (this.mode === 'slow') return 0.015;
    if (this.mode === 'normal') return 0.04;
    if (this.mode === 'fast') return 0.08;
    return 0.04;
  }

  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    // 筒体外壳（金属质感）
    const grad = ctx.createRadialGradient(
      this.cx - 15, this.cy - 15, 5,
      this.cx, this.cy, this.r + 12
    );
    grad.addColorStop(0, '#6688aa');
    grad.addColorStop(0.5, '#446688');
    grad.addColorStop(1, '#224466');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.cx, this.cy, this.r + 12, 0, Math.PI * 2);
    ctx.fill();

    // 筒体内壁
    ctx.fillStyle = '#003355';
    ctx.beginPath();
    ctx.arc(this.cx, this.cy, this.r, 0, Math.PI * 2);
    ctx.fill();

    // 筒壁旋转标记（8条线）
    ctx.strokeStyle = '#5577aa';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = this.angle + (i * Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(this.cx + Math.cos(a) * (this.r - 6), this.cy + Math.sin(a) * (this.r - 6));
      ctx.lineTo(this.cx + Math.cos(a) * this.r, this.cy + Math.sin(a) * this.r);
      ctx.stroke();
    }

    // 中心轴
    ctx.fillStyle = '#aabbcc';
    ctx.beginPath();
    ctx.arc(this.cx, this.cy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8899aa';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(this.cx, this.cy, 5, 0, Math.PI * 2);
    ctx.stroke();

    // 球
    for (let ball of this.balls) {
      const bg = ctx.createRadialGradient(
        ball.x - 2, ball.y - 2, 0.5,
        ball.x, ball.y, ball.radius
      );
      bg.addColorStop(0, this.lighten(ball.color, 60));
      bg.addColorStop(0.7, ball.color);
      bg.addColorStop(1, this.darken(ball.color, 40));
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(ball.x - 2, ball.y - 2, ball.radius * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 旋转方向箭头
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.cx, this.cy, this.r + 16, -0.3, 0.3);
    ctx.stroke();
    const ax = this.cx + Math.cos(0.3) * (this.r + 16);
    const ay = this.cy + Math.sin(0.3) * (this.r + 16);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 4, ay - 7);
    ctx.lineTo(ax + 3, ay - 4);
    ctx.closePath();
    ctx.fill();
  }

  lighten(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${Math.min(255,(n>>16)+amt)},${Math.min(255,((n>>8)&255)+amt)},${Math.min(255,(n&255)+amt)})`;
  }
  darken(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${Math.max(0,(n>>16)-amt)},${Math.max(0,((n>>8)&255)-amt)},${Math.max(0,(n&255)-amt)})`;
  }
}

// ===== 模式管理 =====
let currentMode = 'normal';
let mills = [];

function setupStage(mode) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  mills = [];

  const sizes = {
    slow:    { w: 360, h: 320, label: '过慢', labelClass: 'slow' },
    normal:  { w: 360, h: 320, label: '适当', labelClass: 'normal' },
    fast:    { w: 360, h: 320, label: '过快', labelClass: 'fast' },
  };

  if (mode === 'compare') {
    // 对比模式：三个并排
    for (const m of ['slow', 'normal', 'fast']) {
      const s = sizes[m];
      const unit = document.createElement('div');
      unit.className = 'mill-unit';
      const canvas = document.createElement('canvas');
      canvas.width = s.w;
      canvas.height = s.h;
      const label = document.createElement('div');
      label.className = 'mill-label ' + s.labelClass;
      label.textContent = s.label;
      unit.appendChild(canvas);
      unit.appendChild(label);
      stage.appendChild(unit);
      mills.push(new BallMill(canvas, m));
    }
  } else {
    // 单个模式
    const s = sizes[mode];
    const unit = document.createElement('div');
    unit.className = 'mill-unit';
    const canvas = document.createElement('canvas');
    canvas.width = s.w;
    canvas.height = s.h;
    const label = document.createElement('div');
    label.className = 'mill-label ' + s.labelClass;
    label.textContent = s.label;
    unit.appendChild(canvas);
    unit.appendChild(label);
    stage.appendChild(unit);
    mills.push(new BallMill(canvas, mode));
  }

  // 更新按钮状态
  document.querySelectorAll('.btn-bar button').forEach(btn => btn.classList.remove('active'));
  const btnMap = { slow: 'btn-slow', normal: 'btn-normal', fast: 'btn-fast', compare: 'btn-compare' };
  document.getElementById(btnMap[mode]).classList.add('active');
}

function setMode(mode) {
  currentMode = mode;
  setupStage(mode);
}

// 初始
setMode('normal');

// 动画循环
function animate() {
  for (let mill of mills) {
    mill.update();
    mill.draw();
  }
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
